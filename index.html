<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta property="og:title" content="Portfólio Kiusky">
  <meta property="og:description" content="Transformo ideias em soluções digitais">
  <meta property="og:image" content="https://kiusky.github.io/portfolio/img/logo.webp">
  <meta property="og:url" content="https://kiusky.github.io/portfolio/">
  <meta name="google-adsense-account" content="ca-pub-5124901329251101">
  <title>Kiusky</title>
  <link rel="icon" type="image/x-icon" href="https://kiusky.github.io/portfolio/img/logo.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>#loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#2f3135;display:flex;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.5s ease}#loader.hidden{opacity:0;pointer-events:none}#loader img{width:150px;height:150px;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}#main-content{opacity:0;transition:opacity 0.8s ease}#main-content.visible{opacity:1}</style>
</head>
<body>
  <div id="loader">
    <img src="https://kiusky.github.io/portfolio/img/logo.webp" alt="Logo" draggable="false">
  </div>
  <div id="main-content">
    <div class="container">  
      <nav class="navbar">
        <div class="logo">
          <img src="img/logo.webp" alt="Logo" draggable="false" class="logo-icon">
          <span class="logo-text">Kiusky<span></span></span>
          <span class="logo-sub">Giuliano Junior</span>
        </div>
        <div class="nav-links">
          <a href="#contato" class="btn-contato"><i class="fa-solid fa-comments"></i> Fale comigo</a>
          <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </nav>
      <section class="hero">
        <div class="hero-text">
          <h1>Transformo ideias em <span>soluções</span> digitais</h1>
          <div class="hero-stats">
            <div><i class="fas fa-check-circle"></i> 15+ anos</div>
            <div><i class="fas fa-code"></i> 50+ projetos</div>
            <div><i class="fas fa-users"></i> 1M+ serviços</div>
          </div>
        </div>
      </section>
      <div class="diferenciais">
        <div class="glass-sparkle"></div>
        <div class="glass-sparkle"></div>
        <div class="glass-sparkle"></div>
        <div class="diferenciais-grid">
          <div><i class="fas fa-shield-alt"></i><h4>Segurança</h4><p>Práticas atualizadas</p></div>
          <div><i class="fas fa-clock"></i><h4>Agilidade</h4><p>Entregas no prazo</p></div>
          <div><i class="fas fa-headset"></i><h4>Suporte</h4><p>Pós-atendimento dedicado</p></div>
          <div><i class="fas fa-handshake"></i><h4>Confiança</h4><p>Parceria transparente</p></div>
        </div>
      </div>
      <footer>
        <span style="font-weight: 400;">Copyright © 2026 Kiusky — Especialista em TI</span>
        <div class="social-links">
          <a href="https://www.linkedin.com/in/giuliano-jr/" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin-in"></i></a>
          <a href="https://discord.com/users/351072738053586955" target="_blank" rel="noopener noreferrer"><i class="fab fa-discord"></i></a>
          <a href="https://github.com/Kiusky" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
        </div>
      </footer>
    </div>
  </div>
  <script src="script.js"></script>
  <script>window.addEventListener("load",function(){const e=document.getElementById("loader"),t=document.getElementById("main-content");setTimeout(function(){e.classList.add("hidden"),t.classList.add("visible")},500)}),setTimeout(function(){const e=document.getElementById("loader");e.classList.contains("hidden")||(e.classList.add("hidden"),document.getElementById("main-content").classList.add("visible"))},5e3);</script>
</body>
</html>
